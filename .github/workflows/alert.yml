name: Crypto Alert Bot
on:
  schedule:
    # runs every 30 minutes
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab
permissions:
  contents: write  # needed so the bot can commit the updated seen_ids.json
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROTOCOLS: ${{ secrets.PROTOCOLS }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          TRACKED_EVM_CONTRACTS: ${{ secrets.TRACKED_EVM_CONTRACTS }}
          TRACKED_SOLANA_TOKENS: ${{ secrets.TRACKED_SOLANA_TOKENS }}
        run: python main.py
      - name: Commit updated state files
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_ids.json topic_history.json || true
          git diff --staged --quiet || git commit -m "update bot state [skip ci]"
          git pull --rebase origin main || true
          git push
