name: Crypto Alert Bot

on:
  schedule:
    # runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed so the bot can commit the updated seen_ids.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROTOCOLS: ${{ secrets.PROTOCOLS }}
        run: python main.py

      - name: Commit updated seen_ids.json
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_ids.json || true
          git diff --staged --quiet || git commit -m "update seen items [skip ci]"
          git pull --rebase origin main || true
          git push
