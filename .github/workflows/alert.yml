name: Crypto Alert Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROTOCOLS: ${{ secrets.PROTOCOLS }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_ids.json topic_history.json || true
          git diff --staged --quiet || git commit -m "update bot state [skip ci]"
          git pull --rebase origin main || true
          git push
