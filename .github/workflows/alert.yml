name: Web3Station Content Radar

on:
  schedule:
    # every 30 minutes
    - cron: "0,30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web3Station
        env:

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}

        run: |
          python main.py

      - name: Save bot state
        run: |

          git config user.name "web3station-bot"
          git config user.email "bot@users.noreply.github.com"

          git add seen_ids.json topic_history.json

          git diff --staged --quiet || \
            git commit -m "update Web3Station state [skip ci]"

          git pull --rebase origin main || true

          git push
