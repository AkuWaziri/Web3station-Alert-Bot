name: Web3Station Intelligence Bot

on:
  schedule:
    # runs approximately every 30 minutes
    - cron: "7,37 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # RUN BOT
      # ------------------------------------------------------

      - name: Run Web3Station
        env:

          # Telegram
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Market data
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          # AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Social intelligence
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}

          # GitHub API
          # GitHub automatically creates this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional configuration variables
          # Defaults are used if these variables are not created.
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MIN_SIGNAL_SCORE: ${{ vars.MIN_SIGNAL_SCORE || '6' }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS || '5' }}
          WATCHLIST: ${{ vars.WATCHLIST || 'BTC,ETH,SOL,USDC,USDT' }}

        run: |
          python main.py


      # ------------------------------------------------------
      # SAVE BOT MEMORY
      # ------------------------------------------------------

      - name: Save Web3Station memory
        run: |

          git config user.name "web3station-bot"
          git config user.email "bot@users.noreply.github.com"

          git add seen_ids.json topic_history.json

          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update Web3Station memory [skip ci]"
            git push
          fi
