name: Web3Station Intelligence Bot

on:
  schedule:
    # approximately every 30 minutes
    # offset from the top/bottom of the hour
    - cron: "7,37 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web3Station
        env:

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          SORSA_API_KEY: ${{ secrets.SORSA_API_KEY }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MIN_SIGNAL_SCORE: ${{ vars.MIN_SIGNAL_SCORE }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS }}
          WATCHLIST: ${{ vars.WATCHLIST }}

        run: |
          python main.py

      - name: Save Web3Station memory
        run: |

          git config user.name "web3station-bot"
          git config user.email "bot@users.noreply.github.com"

          git add seen_ids.json topic_history.json

          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "update Web3Station memory [skip ci]"
            git push
          fi
