name: X Account Watcher

on:
  schedule:
    # every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run X watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          WATCHED_X_ACCOUNTS: ${{ secrets.WATCHED_X_ACCOUNTS }}
          X_SEARCH_QUERIES: ${{ secrets.X_SEARCH_QUERIES }}
        run: python watcher.py

      - name: Save watcher state
        run: |
          git config user.name "web3station-bot"
          git config user.email "bot@users.noreply.github.com"

          git add watcher_seen.json

          git diff --staged --quiet || git commit -m "update X watcher state [skip ci]"

          git pull --rebase origin main || true
          git push
